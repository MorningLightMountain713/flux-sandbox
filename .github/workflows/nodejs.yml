name: Node CI

# SANDBOX: Check Hash + Request hash publication verbatim from RunOnFlux/flux
# feat/hashlist-dispatch @ e61206b24, with the fluxhashes repo and the fork guard pointed at the
# sandbox pair.

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      # Computed before anything below touches the workspace, so the value describes the pristine
      # checkout -- the same tree a node running this commit will hash.
      - name: Check Hash
        run: |
          newhash=$(find ./ZelBack -type f -exec md5sum {} + | awk '{print $1}' | LC_ALL=C sort | md5sum | awk '{printf $1}')
          echo $newhash
          echo NEW_HASH=$newhash >> $GITHUB_ENV
      # Publication is a request, not a write: the fluxhashes signer fetches this commit itself,
      # derives the tree hash from the bytes it fetched, and publishes list, signed document and
      # provenance in one commit. The token can trigger that workflow and nothing else. NEW_HASH
      # rides along as a tripwire the signer checks against its own computation -- a mismatch is a
      # red signing run, never a listed value. Forks publish nothing.
      - name: Request hash publication
        if: github.repository == 'MorningLightMountain713/flux-sandbox'
        env:
          GH_TOKEN: ${{ secrets.FLUXHASHES_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/MorningLightMountain713/fluxhashes-sandbox/actions/workflows/sign-hashlist.yml/dispatches \
            -f ref=master \
            -f "inputs[commit]=${GITHUB_SHA}" \
            -f "inputs[ref]=${GITHUB_REF_NAME}" \
            -f "inputs[ref_type]=${GITHUB_REF_TYPE}" \
            -f "inputs[claimed_hash]=${NEW_HASH}"
